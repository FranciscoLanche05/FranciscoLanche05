<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 380" width="100%" height="380">
  <defs>
    <style>
      @keyframes gold-shine {
        0%, 100% { filter: drop-shadow(0 0 4px #FFD700); }
        50% { filter: drop-shadow(0 0 12px #FFA000); }
      }
      @keyframes gem-pulse-c {
        0%, 100% { fill: #00E5FF; }
        50% { fill: #76FF03; }
      }
      .trophy-glow { animation: gold-shine 3s infinite ease-in-out; }
      .gem-c { animation: gem-pulse-c 3s infinite ease-in-out; }
    </style>
    <linearGradient id="hallBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1424"/>
      <stop offset="50%" stop-color="#182238"/>
      <stop offset="100%" stop-color="#090D18"/>
    </linearGradient>
    <linearGradient id="goldPlaque" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8860B"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="trophyCup" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <linearGradient id="silverCup" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ECEFF1"/>
      <stop offset="50%" stop-color="#B0BEC5"/>
      <stop offset="100%" stop-color="#78909C"/>
    </linearGradient>
    <linearGradient id="bronzeCup" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFCCBC"/>
      <stop offset="50%" stop-color="#D7CCC8"/>
      <stop offset="100%" stop-color="#8D6E63"/>
    </linearGradient>
    <linearGradient id="statBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00BCD4"/>
      <stop offset="100%" stop-color="#80DEEA"/>
    </linearGradient>
  </defs>

  <!-- Outer Grand Hall Frame -->
  <rect x="5" y="5" width="860" height="370" rx="12" fill="url(#hallBg)" stroke="#D4AF37" stroke-width="3"/>
  <rect x="12" y="12" width="846" height="356" rx="8" fill="none" stroke="#00E5FF" stroke-width="1" opacity="0.3"/>

  <!-- Top Title Plaque -->
  <rect x="235" y="8" width="400" height="36" rx="5" fill="#141c30" stroke="#FFD700" stroke-width="2"/>
  <text x="435" y="32" fill="#FFD700" font-family="'Courier New', monospace" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="2">🏆 SALÓN DE TROFEOS Y LOGROS 🏆</text>

  <!-- ========================================================
       TOP ROW: 4 MEDIEVAL PIXEL TROPHIES
       ======================================================== -->

  <!-- Trophy 1: Repositories Master -->
  <g class="trophy-glow" transform="translate(40, 60)">
    <rect x="0" y="0" width="180" height="110" rx="8" fill="#131C30" stroke="#FFD700" stroke-width="1.8"/>
    <!-- Pixel Trophy Cup -->
    <polygon points="90,14 74,32 106,32" fill="url(#trophyCup)"/>
    <rect x="74" y="32" width="32" height="14" rx="2" fill="url(#trophyCup)"/>
    <rect x="87" y="46" width="6" height="10" fill="#B8860B"/>
    <rect x="80" y="56" width="20" height="6" fill="#FFD700"/>
    <!-- Trophy Handles -->
    <path d="M 74 24 Q 64 24 64 36 Q 64 44 74 44" fill="none" stroke="#FFD700" stroke-width="2.5"/>
    <path d="M 106 24 Q 116 24 116 36 Q 116 44 106 44" fill="none" stroke="#FFD700" stroke-width="2.5"/>
    <!-- Label -->
    <text x="90" y="78" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="12" font-weight="900" text-anchor="middle">35+ REPOS</text>
    <text x="90" y="96" fill="#64FFDA" font-family="'Courier New', monospace" font-size="10" font-weight="bold" text-anchor="middle">REINOS CREADOS</text>
  </g>

  <!-- Trophy 2: Code Explorer -->
  <g class="trophy-glow" transform="translate(240, 60)">
    <rect x="0" y="0" width="180" height="110" rx="8" fill="#131C30" stroke="#00E5FF" stroke-width="1.8"/>
    <!-- Silver Cup -->
    <polygon points="90,14 74,32 106,32" fill="url(#silverCup)"/>
    <rect x="74" y="32" width="32" height="14" rx="2" fill="url(#silverCup)"/>
    <rect x="87" y="46" width="6" height="10" fill="#78909C"/>
    <rect x="80" y="56" width="20" height="6" fill="#B0BEC5"/>
    <path d="M 74 24 Q 64 24 64 36 Q 64 44 74 44" fill="none" stroke="#B0BEC5" stroke-width="2.5"/>
    <path d="M 106 24 Q 116 24 116 36 Q 116 44 106 44" fill="none" stroke="#B0BEC5" stroke-width="2.5"/>
    <!-- Label -->
    <text x="90" y="78" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="12" font-weight="900" text-anchor="middle">FULL STACK</text>
    <text x="90" y="96" fill="#80D8FF" font-family="'Courier New', monospace" font-size="10" font-weight="bold" text-anchor="middle">EXPLORADOR ACTIVO</text>
  </g>

  <!-- Trophy 3: Commit Streak -->
  <g class="trophy-glow" transform="translate(440, 60)">
    <rect x="0" y="0" width="180" height="110" rx="8" fill="#131C30" stroke="#FF5252" stroke-width="1.8"/>
    <!-- Flame Trophy -->
    <polygon points="90,14 74,32 106,32" fill="url(#trophyCup)"/>
    <rect x="74" y="32" width="32" height="14" rx="2" fill="url(#trophyCup)"/>
    <rect x="87" y="46" width="6" height="10" fill="#B8860B"/>
    <rect x="80" y="56" width="20" height="6" fill="#FFD700"/>
    <path d="M 74 24 Q 64 24 64 36 Q 64 44 74 44" fill="none" stroke="#FF5252" stroke-width="2.5"/>
    <path d="M 106 24 Q 116 24 116 36 Q 116 44 106 44" fill="none" stroke="#FF5252" stroke-width="2.5"/>
    <text x="90" y="78" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="12" font-weight="900" text-anchor="middle">RACHA ACTIVA</text>
    <text x="90" y="96" fill="#FF8A80" font-family="'Courier New', monospace" font-size="10" font-weight="bold" text-anchor="middle">FUEGO DE CÓDIGO</text>
  </g>

  <!-- Trophy 4: Code Magician -->
  <g class="trophy-glow" transform="translate(640, 60)">
    <rect x="0" y="0" width="180" height="110" rx="8" fill="#131C30" stroke="#E040FB" stroke-width="1.8"/>
    <!-- Magic Cup -->
    <polygon points="90,14 74,32 106,32" fill="url(#bronzeCup)"/>
    <rect x="74" y="32" width="32" height="14" rx="2" fill="url(#bronzeCup)"/>
    <rect x="87" y="46" width="6" height="10" fill="#5D4037"/>
    <rect x="80" y="56" width="20" height="6" fill="#D7CCC8"/>
    <path d="M 74 24 Q 64 24 64 36 Q 64 44 74 44" fill="none" stroke="#E040FB" stroke-width="2.5"/>
    <path d="M 106 24 Q 116 24 116 36 Q 116 44 106 44" fill="none" stroke="#E040FB" stroke-width="2.5"/>
    <text x="90" y="78" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="12" font-weight="900" text-anchor="middle">MAGO NIVEL 18</text>
    <text x="90" y="96" fill="#EA80FC" font-family="'Courier New', monospace" font-size="10" font-weight="bold" text-anchor="middle">APRENDIZ DE SINTAXIS</text>
  </g>

  <!-- ========================================================
       BOTTOM ROW: STATS & GUILD ACHIEVEMENTS
       ======================================================== -->
  
  <!-- Left Box: Activity Summary -->
  <g transform="translate(40, 190)">
    <rect x="0" y="0" width="380" height="165" rx="8" fill="#131C30" stroke="#3D5A80" stroke-width="1.5"/>
    <!-- Box Title -->
    <rect x="15" y="12" width="350" height="24" rx="4" fill="#1E2A44" stroke="#00E5FF" stroke-width="1"/>
    <text x="190" y="28" fill="#00E5FF" font-family="'Courier New', monospace" font-size="12" font-weight="900" text-anchor="middle">⚔️ RESUMEN DE ACTIVIDAD DE BATALLA</text>
    
    <text x="25" y="60" fill="#E0E0E0" font-family="'Courier New', monospace" font-size="12">🛡️ Repositorios Públicos:</text>
    <text x="355" y="60" fill="#FFD700" font-family="'Courier New', monospace" font-size="12" font-weight="900" text-anchor="end">37 Repos</text>

    <text x="25" y="85" fill="#E0E0E0" font-family="'Courier New', monospace" font-size="12">⚡ Enfoque Principal:</text>
    <text x="355" y="85" fill="#69F0AE" font-family="'Courier New', monospace" font-size="12" font-weight="900" text-anchor="end">Full Stack Dev</text>

    <text x="25" y="110" fill="#E0E0E0" font-family="'Courier New', monospace" font-size="12">🌱 Estado del Aventurero:</text>
    <text x="355" y="110" fill="#80D8FF" font-family="'Courier New', monospace" font-size="12" font-weight="900" text-anchor="end">En Aprendizaje Activo</text>

    <text x="25" y="135" fill="#E0E0E0" font-family="'Courier New', monospace" font-size="12">🎯 Próximo Rango:</text>
    <text x="355" y="135" fill="#FF80AB" font-family="'Courier New', monospace" font-size="12" font-weight="900" text-anchor="end">Mago de Rango C (Lv.25)</text>
  </g>

  <!-- Right Box: Top Mastered Languages -->
  <g transform="translate(440, 190)">
    <rect x="0" y="0" width="380" height="165" rx="8" fill="#131C30" stroke="#3D5A80" stroke-width="1.5"/>
    <rect x="15" y="12" width="350" height="24" rx="4" fill="#1E2A44" stroke="#FFD700" stroke-width="1"/>
    <text x="190" y="28" fill="#FFD700" font-family="'Courier New', monospace" font-size="12" font-weight="900" text-anchor="middle">🔮 HECHIZOS &amp; LENGUAJES DOMINADOS</text>

    <!-- Language 1: JavaScript / TypeScript -->
    <text x="25" y="60" fill="#FFF" font-family="'Courier New', monospace" font-size="11.5" font-weight="bold">JavaScript / TS</text>
    <text x="355" y="60" fill="#F7DF1E" font-family="'Courier New', monospace" font-size="11" font-weight="bold" text-anchor="end">35%</text>
    <rect x="25" y="66" width="330" height="8" rx="2" fill="#0A1828"/>
    <rect x="25" y="66" width="115" height="8" rx="2" fill="#F7DF1E"/>

    <!-- Language 2: HTML & CSS -->
    <text x="25" y="92" fill="#FFF" font-family="'Courier New', monospace" font-size="11.5" font-weight="bold">HTML5 &amp; CSS3</text>
    <text x="355" y="92" fill="#E44D26" font-family="'Courier New', monospace" font-size="11" font-weight="bold" text-anchor="end">28%</text>
    <rect x="25" y="98" width="330" height="8" rx="2" fill="#0A1828"/>
    <rect x="25" y="98" width="92" height="8" rx="2" fill="#E44D26"/>

    <!-- Language 3: Python & Backend -->
    <text x="25" y="124" fill="#FFF" font-family="'Courier New', monospace" font-size="11.5" font-weight="bold">Python &amp; Node.js</text>
    <text x="355" y="124" fill="#3776AB" font-family="'Courier New', monospace" font-size="11" font-weight="bold" text-anchor="end">22%</text>
    <rect x="25" y="130" width="330" height="8" rx="2" fill="#0A1828"/>
    <rect x="25" y="130" width="72" height="8" rx="2" fill="#3776AB"/>

    <!-- Language 4: C# & Unity / SQL -->
    <text x="25" y="152" fill="#FFF" font-family="'Courier New', monospace" font-size="11" font-weight="bold">C# &amp; SQL</text>
    <text x="355" y="152" fill="#239120" font-family="'Courier New', monospace" font-size="11" font-weight="bold" text-anchor="end">15%</text>
  </g>
</svg>
