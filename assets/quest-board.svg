<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 350" width="100%" height="350">
  <defs>
    <style>
      @keyframes pin-shine {
        0%, 100% { fill: #E53935; filter: drop-shadow(0 0 2px #FF5252); }
        50% { fill: #FF8A80; filter: drop-shadow(0 0 6px #FF1744); }
      }
      @keyframes stamp-pulse {
        0%, 100% { filter: drop-shadow(0 0 2px #4CAF50); }
        50% { filter: drop-shadow(0 0 8px #69F0AE); }
      }
      .pin-anim { animation: pin-shine 3s infinite ease-in-out; }
      .stamp-anim { animation: stamp-pulse 3s infinite ease-in-out; }
    </style>
    <linearGradient id="boardWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4E342E"/>
      <stop offset="50%" stop-color="#3E2723"/>
      <stop offset="100%" stop-color="#22110C"/>
    </linearGradient>
    <linearGradient id="parchmentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF5"/>
      <stop offset="50%" stop-color="#FFF5DC"/>
      <stop offset="100%" stop-color="#F7E6BD"/>
    </linearGradient>
    <linearGradient id="titleBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A0D00"/>
      <stop offset="50%" stop-color="#3E2723"/>
      <stop offset="100%" stop-color="#1A0D00"/>
    </linearGradient>
  </defs>

  <!-- Wooden Notice Board Frame -->
  <rect x="5" y="5" width="860" height="340" rx="12" fill="url(#boardWood)" stroke="#1A0D00" stroke-width="4"/>
  <rect x="15" y="15" width="840" height="320" rx="8" fill="#2A160F" stroke="#D7CCC8" stroke-width="1" opacity="0.35"/>

  <!-- Top Title Plaque -->
  <rect x="255" y="8" width="360" height="36" rx="5" fill="url(#titleBarGrad)" stroke="#FFD700" stroke-width="2"/>
  <text x="435" y="32" fill="#FFD700" font-family="'Courier New', monospace" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="2">📜 TABLÓN DE MISIONES · QUEST BOARD 📜</text>

  <!-- ========================================================
       QUEST 1: FULL STACK WEB APPS (ACTIVE / REAL)
       ======================================================== -->
  <g transform="translate(35, 55)">
    <!-- Parchment Paper Base (100% Solid & Permanent) -->
    <rect x="0" y="0" width="255" height="265" rx="6" fill="url(#parchmentGrad)" stroke="#8D6E63" stroke-width="2.5"/>
    <rect x="5" y="5" width="245" height="255" rx="4" fill="none" stroke="#D7CCC8" stroke-width="1" opacity="0.6"/>

    <!-- Red Pin on top -->
    <circle class="pin-anim" cx="127" cy="12" r="6" fill="#E53935"/>
    <circle cx="125" cy="10" r="2" fill="#FFFFFF"/>

    <!-- Quest Header Badge -->
    <rect x="15" y="26" width="225" height="24" rx="4" fill="#2E1C14" stroke="#D4AF37" stroke-width="1"/>
    <text x="127" y="42" fill="#FFD700" font-family="'Courier New', monospace" font-size="11" font-weight="900" text-anchor="middle">⚔️ MISIÓN PRINCIPAL</text>

    <!-- Title & Description -->
    <text x="18" y="74" fill="#1A0D00" font-family="'Courier New', monospace" font-size="13" font-weight="900">🌐 App Web Full Stack</text>
    <text x="18" y="96" fill="#4E342E" font-family="'Courier New', monospace" font-size="11.5" font-weight="bold">Desarrollo de plataforma</text>
    <text x="18" y="114" fill="#4E342E" font-family="'Courier New', monospace" font-size="11.5" font-weight="bold">web moderna con React /</text>
    <text x="18" y="132" fill="#4E342E" font-family="'Courier New', monospace" font-size="11.5" font-weight="bold">Next.js en Frontend y</text>
    <text x="18" y="150" fill="#4E342E" font-family="'Courier New', monospace" font-size="11.5" font-weight="bold">Node.js + SQL en Backend.</text>

    <!-- Reward Box -->
    <rect x="15" y="168" width="225" height="42" rx="4" fill="#FFFDE7" stroke="#FFB300" stroke-width="1.2"/>
    <text x="24" y="186" fill="#E65100" font-family="'Courier New', monospace" font-size="10" font-weight="900">🏆 RECOMPENSA:</text>
    <text x="24" y="201" fill="#2E7D32" font-family="'Courier New', monospace" font-size="11" font-weight="900">+3,500 EXP · 💎 Arquitectura</text>

    <!-- Status Button -->
    <rect class="stamp-anim" x="52" y="222" width="150" height="28" rx="4" fill="#2E7D32" stroke="#1B5E20" stroke-width="1.8"/>
    <text x="127" y="240" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="11.5" font-weight="900" text-anchor="middle">🟢 EN PROGRESO</text>
  </g>

  <!-- ========================================================
       QUEST 2: APIS REST & TYPESCRIPT (FUTURA / GREMIO)
       ======================================================== -->
  <g transform="translate(307, 55)">
    <!-- Parchment Paper Base -->
    <rect x="0" y="0" width="255" height="265" rx="6" fill="url(#parchmentGrad)" stroke="#8D6E63" stroke-width="2.5"/>
    <rect x="5" y="5" width="245" height="255" rx="4" fill="none" stroke="#D7CCC8" stroke-width="1" opacity="0.6"/>

    <!-- Blue Pin on top -->
    <circle cx="127" cy="12" r="6" fill="#1976D2"/>
    <circle cx="125" cy="10" r="2" fill="#FFFFFF"/>

    <!-- Quest Header Badge -->
    <rect x="15" y="26" width="225" height="24" rx="4" fill="#2E1C14" stroke="#00E5FF" stroke-width="1"/>
    <text x="127" y="42" fill="#80D8FF" font-family="'Courier New', monospace" font-size="11" font-weight="900" text-anchor="middle">🛡️ MISIÓN DE GREMIO</text>

    <!-- Title & Description -->
    <text x="18" y="74" fill="#1A0D00" font-family="'Courier New', monospace" font-size="13" font-weight="900">⚡ APIs &amp; TypeScript</text>
    <text x="18" y="96" fill="#4E342E" font-family="'Courier New', monospace" font-size="11.5" font-weight="bold">Diseño de microservicios,</text>
    <text x="18" y="114" fill="#4E342E" font-family="'Courier New', monospace" font-size="11.5" font-weight="bold">tipado estricto con TS,</text>
    <text x="18" y="132" fill="#4E342E" font-family="'Courier New', monospace" font-size="11.5" font-weight="bold">autenticación segura JWT</text>
    <text x="18" y="150" fill="#4E342E" font-family="'Courier New', monospace" font-size="11.5" font-weight="bold">y bases de datos SQL.</text>

    <!-- Reward Box -->
    <rect x="15" y="168" width="225" height="42" rx="4" fill="#FFFDE7" stroke="#FFB300" stroke-width="1.2"/>
    <text x="24" y="186" fill="#E65100" font-family="'Courier New', monospace" font-size="10" font-weight="900">🏆 RECOMPENSA:</text>
    <text x="24" y="201" fill="#1565C0" font-family="'Courier New', monospace" font-size="11" font-weight="900">+4,200 EXP · 🛡️ Seguridad</text>

    <!-- Status Button -->
    <rect x="52" y="222" width="150" height="28" rx="4" fill="#F57F17" stroke="#E65100" stroke-width="1.8"/>
    <text x="127" y="240" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="11.5" font-weight="900" text-anchor="middle">🟡 PRÓXIMA MISIÓN</text>
  </g>

  <!-- ========================================================
       QUEST 3: VIDEOJUEGOS 2D EN UNITY (CREATIVA / ESPECIAL)
       ======================================================== -->
  <g transform="translate(580, 55)">
    <!-- Parchment Paper Base -->
    <rect x="0" y="0" width="255" height="265" rx="6" fill="url(#parchmentGrad)" stroke="#8D6E63" stroke-width="2.5"/>
    <rect x="5" y="5" width="245" height="255" rx="4" fill="none" stroke="#D7CCC8" stroke-width="1" opacity="0.6"/>

    <!-- Gold Pin on top -->
    <circle cx="127" cy="12" r="6" fill="#FFB300"/>
    <circle cx="125" cy="10" r="2" fill="#FFFFFF"/>

    <!-- Quest Header Badge -->
    <rect x="15" y="26" width="225" height="24" rx="4" fill="#2E1C14" stroke="#FFD700" stroke-width="1"/>
    <text x="127" y="42" fill="#FFD54F" font-family="'Courier New', monospace" font-size="11" font-weight="900" text-anchor="middle">🎮 MISIÓN ESPECIAL</text>

    <!-- Title & Description -->
    <text x="18" y="74" fill="#1A0D00" font-family="'Courier New', monospace" font-size="13" font-weight="900">🕹️ Juego 2D en Unity</text>
    <text x="18" y="96" fill="#4E342E" font-family="'Courier New', monospace" font-size="11.5" font-weight="bold">Creación de videojuego</text>
    <text x="18" y="114" fill="#4E342E" font-family="'Courier New', monospace" font-size="11.5" font-weight="bold">en C# con estética pixel</text>
    <text x="18" y="132" fill="#4E342E" font-family="'Courier New', monospace" font-size="11.5" font-weight="bold">art, sistema de inventario</text>
    <text x="18" y="150" fill="#4E342E" font-family="'Courier New', monospace" font-size="11.5" font-weight="bold">y mecánicas de aventura.</text>

    <!-- Reward Box -->
    <rect x="15" y="168" width="225" height="42" rx="4" fill="#FFFDE7" stroke="#FFB300" stroke-width="1.2"/>
    <text x="24" y="186" fill="#E65100" font-family="'Courier New', monospace" font-size="10" font-weight="900">🏆 RECOMPENSA:</text>
    <text x="24" y="201" fill="#C2185B" font-family="'Courier New', monospace" font-size="11" font-weight="900">+5,000 EXP · 🎮 Logro Retro</text>

    <!-- Status Button -->
    <rect x="52" y="222" width="150" height="28" rx="4" fill="#D84315" stroke="#BF360C" stroke-width="1.8"/>
    <text x="127" y="240" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="11.5" font-weight="900" text-anchor="middle">🔥 EXPERIMENTANDO</text>
  </g>
</svg>
