<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 340" width="100%" height="340">
  <defs>
    <style>
      @keyframes pin-shine {
        0%, 100% { fill: #E53935; }
        50% { fill: #FF8A80; }
      }
      @keyframes stamp-glow {
        0%, 100% { filter: drop-shadow(0 0 2px #4CAF50); }
        50% { filter: drop-shadow(0 0 6px #81C784); }
      }
      @keyframes quest-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      .pin { animation: pin-shine 3s infinite ease-in-out; }
      .stamp-cleared { animation: stamp-glow 3s infinite ease-in-out; }
      .parchment { animation: quest-float 4s infinite ease-in-out; }
    </style>
    <linearGradient id="boardWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4E342E"/>
      <stop offset="50%" stop-color="#3E2723"/>
      <stop offset="100%" stop-color="#27130E"/>
    </linearGradient>
    <linearGradient id="parchmentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E1"/>
      <stop offset="50%" stop-color="#FFECB3"/>
      <stop offset="100%" stop-color="#FFE082"/>
    </linearGradient>
  </defs>

  <!-- Wooden Notice Board Frame -->
  <rect x="5" y="5" width="840" height="330" rx="12" fill="url(#boardWood)" stroke="#1A0D00" stroke-width="4"/>
  <rect x="15" y="15" width="820" height="310" rx="8" fill="#2E1C14" stroke="#D7CCC8" stroke-width="1" opacity="0.3"/>

  <!-- Top Banner Title Plaque -->
  <rect x="250" y="8" width="350" height="36" rx="4" fill="#1A0D00" stroke="#FFD700" stroke-width="2"/>
  <text x="425" y="32" fill="#FFD700" font-family="'Courier New', monospace" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="2">📜 TABLÓN DE MISIONES · QUESTS</text>

  <!-- QUEST PARCHMENT 1 (MAIN QUEST - ACTIVE) -->
  <g class="parchment" transform="translate(40, 60)">
    <rect x="0" y="0" width="235" height="240" rx="6" fill="url(#parchmentGrad)" stroke="#8D6E63" stroke-width="2"/>
    <!-- Red Pin -->
    <circle class="pin" cx="117" cy="12" r="5" fill="#E53935"/>
    <circle cx="115" cy="10" r="1.5" fill="#FFF"/>

    <!-- Quest Header -->
    <rect x="15" y="28" width="205" height="24" rx="3" fill="#3E2723"/>
    <text x="117" y="44" fill="#FFD700" font-family="'Courier New', monospace" font-size="11" font-weight="900" text-anchor="middle">⚔️ MISIÓN PRINCIPAL</text>

    <text x="20" y="75" fill="#212121" font-family="'Courier New', monospace" font-size="13" font-weight="900">🌐 Full Stack Web Apps</text>
    <text x="20" y="95" fill="#4E342E" font-family="'Courier New', monospace" font-size="11">Desarrollo de sistemas</text>
    <text x="20" y="110" fill="#4E342E" font-family="'Courier New', monospace" font-size="11">modernos y escalables</text>
    <text x="20" y="125" fill="#4E342E" font-family="'Courier New', monospace" font-size="11">con React, Next y Node.</text>

    <!-- Reward Box -->
    <rect x="15" y="145" width="205" height="40" rx="4" fill="#FFFDE7" stroke="#FFB300" stroke-width="1"/>
    <text x="25" y="162" fill="#F57F17" font-family="'Courier New', monospace" font-size="10" font-weight="bold">🏆 RECOMPENSA:</text>
    <text x="25" y="177" fill="#2E7D32" font-family="'Courier New', monospace" font-size="11" font-weight="900">+5000 EXP · 💎 Código Épico</text>

    <!-- Status Badge -->
    <rect x="55" y="198" width="125" height="26" rx="4" fill="#2E7D32" stroke="#1B5E20" stroke-width="1.5"/>
    <text x="117" y="215" fill="#FFF" font-family="'Courier New', monospace" font-size="11" font-weight="900" text-anchor="middle">🟢 EN PROGRESO</text>
  </g>

  <!-- QUEST PARCHMENT 2 (SECONDARY QUEST - BACKEND & APIS) -->
  <g class="parchment" transform="translate(307, 60)" style="animation-delay: 0.7s;">
    <rect x="0" y="0" width="235" height="240" rx="6" fill="url(#parchmentGrad)" stroke="#8D6E63" stroke-width="2"/>
    <!-- Blue Pin -->
    <circle cx="117" cy="12" r="5" fill="#1976D2"/>
    <circle cx="115" cy="10" r="1.5" fill="#FFF"/>

    <!-- Quest Header -->
    <rect x="15" y="28" width="205" height="24" rx="3" fill="#3E2723"/>
    <text x="117" y="44" fill="#80D8FF" font-family="'Courier New', monospace" font-size="11" font-weight="900" text-anchor="middle">🛡️ MISIÓN DE GREMIO</text>

    <text x="20" y="75" fill="#212121" font-family="'Courier New', monospace" font-size="13" font-weight="900">⚡ APIs &amp; Arquitectura</text>
    <text x="20" y="95" fill="#4E342E" font-family="'Courier New', monospace" font-size="11">Diseño de bases de</text>
    <text x="20" y="110" fill="#4E342E" font-family="'Courier New', monospace" font-size="11">datos SQL y APIs RESTful</text>
    <text x="20" y="125" fill="#4E342E" font-family="'Courier New', monospace" font-size="11">seguras y optimizadas.</text>

    <!-- Reward Box -->
    <rect x="15" y="145" width="205" height="40" rx="4" fill="#FFFDE7" stroke="#FFB300" stroke-width="1"/>
    <text x="25" y="162" fill="#F57F17" font-family="'Courier New', monospace" font-size="10" font-weight="bold">🏆 RECOMPENSA:</text>
    <text x="25" y="177" fill="#2E7D32" font-family="'Courier New', monospace" font-size="11" font-weight="900">+3500 EXP · 🛡️ Rendimiento</text>

    <!-- Status Badge (CLEARED) -->
    <rect class="stamp-cleared" x="55" y="198" width="125" height="26" rx="4" fill="#1565C0" stroke="#0D47A1" stroke-width="1.5"/>
    <text x="117" y="215" fill="#FFF" font-family="'Courier New', monospace" font-size="11" font-weight="900" text-anchor="middle">⭐ COMPLETADA</text>
  </g>

  <!-- QUEST PARCHMENT 3 (SPECIAL QUEST - GAME DEV & CREATIVITY) -->
  <g class="parchment" transform="translate(575, 60)" style="animation-delay: 1.4s;">
    <rect x="0" y="0" width="235" height="240" rx="6" fill="url(#parchmentGrad)" stroke="#8D6E63" stroke-width="2"/>
    <!-- Yellow Pin -->
    <circle cx="117" cy="12" r="5" fill="#F57F17"/>
    <circle cx="115" cy="10" r="1.5" fill="#FFF"/>

    <!-- Quest Header -->
    <rect x="15" y="28" width="205" height="24" rx="3" fill="#3E2723"/>
    <text x="117" y="44" fill="#FFD54F" font-family="'Courier New', monospace" font-size="11" font-weight="900" text-anchor="middle">🎮 MISIÓN ESPECIAL</text>

    <text x="20" y="75" fill="#212121" font-family="'Courier New', monospace" font-size="13" font-weight="900">🕹️ Videojuegos &amp; Pixel</text>
    <text x="20" y="95" fill="#4E342E" font-family="'Courier New', monospace" font-size="11">Desarrollo interactivo</text>
    <text x="20" y="110" fill="#4E342E" font-family="'Courier New', monospace" font-size="11">con C#, Unity y mecánicas</text>
    <text x="20" y="125" fill="#4E342E" font-family="'Courier New', monospace" font-size="11">retro para jugadores.</text>

    <!-- Reward Box -->
    <rect x="15" y="145" width="205" height="40" rx="4" fill="#FFFDE7" stroke="#FFB300" stroke-width="1"/>
    <text x="25" y="162" fill="#F57F17" font-family="'Courier New', monospace" font-size="10" font-weight="bold">🏆 RECOMPENSA:</text>
    <text x="25" y="177" fill="#2E7D32" font-family="'Courier New', monospace" font-size="11" font-weight="900">+4200 EXP · 🎮 Diversión Pura</text>

    <!-- Status Badge -->
    <rect x="55" y="198" width="125" height="26" rx="4" fill="#E65100" stroke="#BF360C" stroke-width="1.5"/>
    <text x="117" y="215" fill="#FFF" font-family="'Courier New', monospace" font-size="11" font-weight="900" text-anchor="middle">🔥 ACTIVA</text>
  </g>
</svg>
