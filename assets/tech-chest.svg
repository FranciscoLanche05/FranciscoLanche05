<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="520">
  <defs>
    <style>
      @keyframes chest-shimmer {
        0%, 100% { filter: drop-shadow(0 0 10px #FFD700); }
        50% { filter: drop-shadow(0 0 25px #FFA000); }
      }
      @keyframes light-cone {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 0.85; }
      }
      @keyframes gem-pulse-anim {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.15); }
      }

      .chest-main { animation: chest-shimmer 3s infinite ease-in-out; }
      .aurora-beam { animation: light-cone 3s infinite ease-in-out; }
    </style>

    <linearGradient id="vaultBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#121a2c"/>
      <stop offset="100%" stop-color="#070a14"/>
    </linearGradient>
    <linearGradient id="goldTrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB300"/>
      <stop offset="50%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <linearGradient id="chestWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4E342E"/>
      <stop offset="50%" stop-color="#3E2723"/>
      <stop offset="100%" stop-color="#27130E"/>
    </linearGradient>
    <linearGradient id="auroraCone" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#00E5FF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7C4DFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background Frame -->
  <rect x="5" y="5" width="950" height="510" rx="12" fill="url(#vaultBg)" stroke="#D4AF37" stroke-width="2.5"/>
  <rect x="12" y="12" width="936" height="496" rx="8" fill="none" stroke="#00E5FF" stroke-width="1" opacity="0.3"/>

  <!-- Top Title Plaque -->
  <rect x="230" y="10" width="500" height="34" rx="5" fill="#121a2d" stroke="#FFD700" stroke-width="1.5"/>
  <text x="480" y="33" fill="#FFD700" font-family="'Courier New', monospace" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="2">👑 EL ARSENAL DE HABILIDADES (NIVEL 18) 👑</text>

  <!-- Radiant Light Cone from chest -->
  <polygon class="aurora-beam" points="480,400 100,60 860,60" fill="url(#auroraCone)"/>

