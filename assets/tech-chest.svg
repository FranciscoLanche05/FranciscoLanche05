<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="100%" height="460">
  <defs>
    <style>
      @keyframes chest-glow {
        0%, 100% { filter: drop-shadow(0 0 8px #FFD700); }
        50% { filter: drop-shadow(0 0 22px #FFA000); }
      }
      @keyframes arc-hover-0 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
      @keyframes arc-hover-1 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
      @keyframes arc-hover-2 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @keyframes beam-sparkle {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 0.65; }
      }
      @keyframes light-burst {
        0%, 100% { opacity: 0.25; transform: scaleY(0.9); }
        50% { opacity: 0.55; transform: scaleY(1.05); }
      }
      @keyframes orb-float {
        0%, 100% { transform: translateY(0) scale(0.8); opacity: 0.4; }
        50% { transform: translateY(-12px) scale(1.2); opacity: 1; }
      }

      .chest-main { animation: chest-glow 3s infinite ease-in-out; }
      .magic-ray { animation: beam-sparkle 2.5s infinite ease-in-out; }
      .burst-light { animation: light-burst 3s infinite ease-in-out; transform-origin: 450px 380px; }
      
      .arc-card-0, .arc-card-10 { animation: arc-hover-0 3.5s infinite ease-in-out 0.1s; }
      .arc-card-1, .arc-card-9 { animation: arc-hover-1 3.2s infinite ease-in-out 0.3s; }
      .arc-card-2, .arc-card-8 { animation: arc-hover-2 3.0s infinite ease-in-out 0.5s; }
      .arc-card-3, .arc-card-7 { animation: arc-hover-1 3.4s infinite ease-in-out 0.7s; }
      .arc-card-4, .arc-card-6 { animation: arc-hover-2 3.1s infinite ease-in-out 0.9s; }
      .arc-card-5 { animation: arc-hover-2 2.8s infinite ease-in-out 1.1s; }

      .orb-1 { animation: orb-float 2.5s infinite ease-in-out; transform-origin: center; }
      .orb-2 { animation: orb-float 3.0s infinite ease-in-out 0.7s; transform-origin: center; }
      .orb-3 { animation: orb-float 2.8s infinite ease-in-out 1.4s; transform-origin: center; }
    </style>

    <linearGradient id="vaultBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#141c30"/>
      <stop offset="100%" stop-color="#080c16"/>
    </linearGradient>
    <linearGradient id="goldTrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB300"/>
      <stop offset="50%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <linearGradient id="chestWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4E342E"/>
      <stop offset="50%" stop-color="#3E2723"/>
      <stop offset="100%" stop-color="#27130E"/>
    </linearGradient>
    <linearGradient id="auroraCone" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.7"/>
      <stop offset="40%" stop-color="#00E5FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7C4DFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect x="5" y="5" width="890" height="450" rx="12" fill="url(#vaultBg)" stroke="#D4AF37" stroke-width="2.5"/>
  <rect x="12" y="12" width="876" height="436" rx="8" fill="none" stroke="#00E5FF" stroke-width="1" opacity="0.25"/>

  <!-- Top Title Plaque -->
  <rect x="250" y="10" width="400" height="32" rx="4" fill="#141c30" stroke="#FFD700" stroke-width="1.5"/>
  <text x="450" y="32" fill="#FFD700" font-family="'Courier New', monospace" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="2">👑 EL ARCO DEL ARSENAL TECH 👑</text>

  <!-- Magical Light Cone radiating up to the Arc -->
  <polygon class="burst-light" points="450,350 80,90 820,90" fill="url(#auroraCone)"/>

  <!-- Arc Guide Curve Line -->
  <path d="M 120 280 Q 450 80 780 280" fill="none" stroke="#FFD700" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.3"/>

