<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 400" width="100%" height="400">
  <defs>
    <style>
      @keyframes bar-pulse-hp {
        0%, 100% { width: 420px; }
        50% { width: 428px; }
      }
      @keyframes bar-pulse-mp {
        0%, 100% { width: 375px; }
        50% { width: 382px; }
      }
      @keyframes bar-pulse-exp {
        0%, 100% { width: 95px; }
        50% { width: 100px; }
      }
      @keyframes badge-glow {
        0%, 100% { filter: drop-shadow(0 0 4px #00E5FF); }
        50% { filter: drop-shadow(0 0 12px #76FF03); }
      }
      @keyframes rank-shimmer {
        0%, 100% { filter: drop-shadow(0 0 2px #E040FB); }
        50% { filter: drop-shadow(0 0 8px #FFD700); }
      }
      .hp-fill { animation: bar-pulse-hp 3.5s infinite ease-in-out; }
      .mp-fill { animation: bar-pulse-mp 3.5s infinite ease-in-out 0.8s; }
      .exp-fill { animation: bar-pulse-exp 3.5s infinite ease-in-out 1.6s; }
      .rank-badge { animation: badge-glow 3s infinite ease-in-out; }
      .mage-badge { animation: rank-shimmer 3s infinite ease-in-out; }
    </style>

    <!-- Clip paths to guarantee 100% no bar overflow -->
    <clipPath id="hpBarClip">
      <rect x="0" y="24" width="530" height="14" rx="4"/>
    </clipPath>
    <clipPath id="mpBarClip">
      <rect x="0" y="68" width="530" height="14" rx="4"/>
    </clipPath>
    <clipPath id="expBarClip">
      <rect x="0" y="112" width="530" height="14" rx="4"/>
    </clipPath>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101524"/>
      <stop offset="50%" stop-color="#182035"/>
      <stop offset="100%" stop-color="#0b0e18"/>
    </linearGradient>
    <linearGradient id="hpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1744"/>
      <stop offset="100%" stop-color="#FF5252"/>
    </linearGradient>
    <linearGradient id="mpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2979FF"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="expGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#76FF03"/>
      <stop offset="100%" stop-color="#B2FF59"/>
    </linearGradient>
    <linearGradient id="statGradJunior" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00BCD4"/>
      <stop offset="100%" stop-color="#80DEEA"/>
    </linearGradient>
    <linearGradient id="statGradMax" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD600"/>
      <stop offset="100%" stop-color="#FFAB00"/>
    </linearGradient>
  </defs>

  <!-- Outer Frame with Gold Pixel Borders -->
  <rect x="5" y="5" width="840" height="390" rx="10" fill="url(#cardBg)" stroke="#D4AF37" stroke-width="3"/>
  <rect x="12" y="12" width="826" height="376" rx="6" fill="none" stroke="#00E5FF" stroke-width="1" opacity="0.3"/>
  
  <!-- Corner Pixel Art Ornaments -->
  <g fill="#FFD700">
    <rect x="8" y="8" width="10" height="4"/>
    <rect x="8" y="8" width="4" height="10"/>
    <rect x="832" y="8" width="10" height="4"/>
    <rect x="838" y="8" width="4" height="10"/>
    <rect x="8" y="388" width="10" height="4"/>
    <rect x="8" y="382" width="4" height="10"/>
    <rect x="832" y="388" width="10" height="4"/>
    <rect x="838" y="382" width="4" height="10"/>
  </g>

  <!-- Header Section -->
  <rect x="25" y="22" width="800" height="52" rx="6" fill="#1f2c4c" stroke="#3d5a80" stroke-width="1.5"/>
  <text x="45" y="54" fill="#FFD700" font-family="'Courier New', monospace" font-size="20" font-weight="900" letter-spacing="2">📜 FICHA DE PERSONAJE · CHARACTER STATUS</text>
  
  <!-- Level Badge (LV. 18) -->
  <g class="rank-badge" transform="translate(760, 48)">
    <polygon points="0,-18 20,-10 20,10 0,18 -20,10 -20,-10" fill="#00E5FF" stroke="#FFF" stroke-width="1.5"/>
    <text x="0" y="5" fill="#0c121e" font-family="'Courier New', monospace" font-size="12" font-weight="900" text-anchor="middle">LV.18</text>
  </g>

  <!-- Left Column: Avatar & Character Details -->
  <g transform="translate(30, 90)">
    <!-- Avatar Box -->
    <rect x="0" y="0" width="220" height="285" rx="8" fill="#151d2f" stroke="#00E5FF" stroke-width="1.5"/>
    
    <!-- Mini Pixel Hero representation -->
    <circle cx="110" cy="55" r="38" fill="#243452" stroke="#64FFDA" stroke-width="2"/>
    <rect x="96" y="28" width="28" height="10" fill="#8B6914"/>
    <rect x="88" y="37" width="44" height="7" fill="#A07828"/>
    <rect x="96" y="44" width="28" height="20" fill="#FDBCB4"/>
    <rect x="101" y="50" width="5" height="5" fill="#1a1a2e"/>
    <rect x="114" y="50" width="5" height="5" fill="#1a1a2e"/>
    <rect x="103" y="52" width="2" height="2" fill="#FFF"/>
    <rect x="116" y="52" width="2" height="2" fill="#FFF"/>
    <rect x="106" y="59" width="8" height="3" fill="#c97878"/>
    <!-- Tunic & Belt -->
    <rect x="92" y="64" width="36" height="22" fill="#2E7D32"/>
    <rect x="92" y="78" width="36" height="4" fill="#5D4037"/>
    <rect x="106" y="76" width="8" height="8" fill="#00E5FF"/>

    <!-- Hero Identity -->
    <text x="110" y="112" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="16" font-weight="900" text-anchor="middle">Francisco Lanche</text>
    
    <!-- RPG Programming Rank Tag -->
    <g class="mage-badge" transform="translate(110, 130)">
      <rect x="-95" y="-10" width="190" height="20" rx="4" fill="#2A1635" stroke="#E040FB" stroke-width="1.2"/>
      <text x="0" y="4" fill="#E040FB" font-family="'Courier New', monospace" font-size="10.5" font-weight="900" text-anchor="middle">🧙‍♂️ MAGO APRENDIZ DE CÓDIGO</text>
    </g>

    <!-- Details Divider -->
    <line x1="15" y1="150" x2="205" y2="150" stroke="#3d5a80" stroke-width="1"/>
    
    <text x="15" y="172" fill="#90CAF9" font-family="'Courier New', monospace" font-size="11">⚔️ CLASE: Junior Full Stack</text>
    <text x="15" y="194" fill="#90CAF9" font-family="'Courier New', monospace" font-size="11">📜 RANGO: Novicio (Rank D)</text>
    <text x="15" y="216" fill="#90CAF9" font-family="'Courier New', monospace" font-size="11">🏰 GUILD: FranciscoLancheDEV</text>
    <text x="15" y="238" fill="#90CAF9" font-family="'Courier New', monospace" font-size="11">🌱 ESTADO: En Aprendizaje</text>
    <text x="15" y="260" fill="#69F0AE" font-family="'Courier New', monospace" font-size="11" font-weight="bold">🎯 META: Nivel 50 (Mid-Dev)</text>
  </g>

  <!-- Right Column: Bars & Attributes (100% Contained) -->
  <g transform="translate(275, 90)">
    <!-- HP BAR (Bounded inside clipPath) -->
    <text x="0" y="16" fill="#FF5252" font-family="'Courier New', monospace" font-size="13" font-weight="900">❤️ HP (Pasión &amp; Energía):</text>
    <text x="530" y="16" fill="#FF8A80" font-family="'Courier New', monospace" font-size="12" text-anchor="end">1,800 / 2,000 (90%)</text>
    <!-- Outer Bar Container -->
    <rect x="0" y="24" width="530" height="14" rx="4" fill="#2d1216" stroke="#FF5252" stroke-width="1.2"/>
    <!-- Inner Animated Bar strictly clipped -->
    <g clip-path="url(#hpBarClip)">
      <rect class="hp-fill" x="0" y="24" width="477" height="14" rx="4" fill="url(#hpGrad)"/>
    </g>

    <!-- MP BAR (Bounded inside clipPath) -->
    <text x="0" y="60" fill="#00E5FF" font-family="'Courier New', monospace" font-size="13" font-weight="900">⚡ MP (Creatividad &amp; Enfoque):</text>
    <text x="530" y="60" fill="#80D8FF" font-family="'Courier New', monospace" font-size="12" text-anchor="end">1,250 / 1,500 (83%)</text>
    <!-- Outer Bar Container -->
    <rect x="0" y="68" width="530" height="14" rx="4" fill="#0a1d30" stroke="#00E5FF" stroke-width="1.2"/>
    <!-- Inner Animated Bar strictly clipped -->
    <g clip-path="url(#mpBarClip)">
      <rect class="mp-fill" x="0" y="68" width="441" height="14" rx="4" fill="url(#mpGrad)"/>
    </g>

    <!-- EXP BAR (Bounded inside clipPath) -->
    <text x="0" y="104" fill="#76FF03" font-family="'Courier New', monospace" font-size="13" font-weight="900">⭐ EXP (Progreso a Siguiente Rango):</text>
    <text x="530" y="104" fill="#CCFF90" font-family="'Courier New', monospace" font-size="12" text-anchor="end">18% (Nivel 18)</text>
    <!-- Outer Bar Container -->
    <rect x="0" y="112" width="530" height="14" rx="4" fill="#152610" stroke="#76FF03" stroke-width="1.2"/>
    <!-- Inner Animated Bar strictly clipped -->
    <g clip-path="url(#expBarClip)">
      <rect class="exp-fill" x="0" y="112" width="95" height="14" rx="4" fill="url(#expGrad)"/>
    </g>

    <!-- Stats Matrix Box (Junior Realistic Stats) -->
    <rect x="0" y="145" width="530" height="140" rx="6" fill="#151d2f" stroke="#3d5a80" stroke-width="1"/>
    
    <!-- Attribute Grid -->
    <!-- Col 1 -->
    <text x="15" y="175" fill="#E0E0E0" font-family="'Courier New', monospace" font-size="12" font-weight="bold">🗡️ FRONTEND:</text>
    <rect x="140" y="165" width="100" height="10" rx="2" fill="#1a3024"/>
    <rect x="140" y="165" width="65" height="10" rx="2" fill="url(#statGradJunior)"/>
    <text x="245" y="174" fill="#80DEEA" font-family="'Courier New', monospace" font-size="11">65/100</text>

    <text x="15" y="208" fill="#E0E0E0" font-family="'Courier New', monospace" font-size="12" font-weight="bold">🛡️ BACKEND:</text>
    <rect x="140" y="198" width="100" height="10" rx="2" fill="#1a3024"/>
    <rect x="140" y="198" width="58" height="10" rx="2" fill="url(#statGradJunior)"/>
    <text x="245" y="207" fill="#80DEEA" font-family="'Courier New', monospace" font-size="11">58/100</text>

    <text x="15" y="241" fill="#E0E0E0" font-family="'Courier New', monospace" font-size="12" font-weight="bold">💾 DATABASE/SQL:</text>
    <rect x="140" y="231" width="100" height="10" rx="2" fill="#1a3024"/>
    <rect x="140" y="231" width="52" height="10" rx="2" fill="url(#statGradJunior)"/>
    <text x="245" y="240" fill="#80DEEA" font-family="'Courier New', monospace" font-size="11">52/100</text>

    <text x="15" y="271" fill="#E0E0E0" font-family="'Courier New', monospace" font-size="12" font-weight="bold">⚙️ GIT &amp; LINUX:</text>
    <rect x="140" y="261" width="100" height="10" rx="2" fill="#1a3024"/>
    <rect x="140" y="261" width="60" height="10" rx="2" fill="url(#statGradJunior)"/>
    <text x="245" y="270" fill="#80DEEA" font-family="'Courier New', monospace" font-size="11">60%</text>

    <!-- Col 2 -->
    <text x="280" y="175" fill="#E0E0E0" font-family="'Courier New', monospace" font-size="12" font-weight="bold">🎮 GAME DEV/UNITY:</text>
    <rect x="425" y="165" width="65" height="10" rx="2" fill="#1a3024"/>
    <rect x="425" y="165" width="33" height="10" rx="2" fill="url(#statGradJunior)"/>
    <text x="495" y="174" fill="#80DEEA" font-family="'Courier New', monospace" font-size="11">50%</text>

    <text x="280" y="208" fill="#E0E0E0" font-family="'Courier New', monospace" font-size="12" font-weight="bold">🧠 PROBLEM SOLVING:</text>
    <rect x="425" y="198" width="65" height="10" rx="2" fill="#1a3024"/>
    <rect x="425" y="198" width="40" height="10" rx="2" fill="url(#statGradJunior)"/>
    <text x="495" y="207" fill="#80DEEA" font-family="'Courier New', monospace" font-size="11">62%</text>

    <text x="280" y="241" fill="#E0E0E0" font-family="'Courier New', monospace" font-size="12" font-weight="bold">⚡ TRABAJO EN EQUIPO:</text>
    <rect x="425" y="231" width="65" height="10" rx="2" fill="#1a3024"/>
    <rect x="425" y="231" width="55" height="10" rx="2" fill="url(#statGradJunior)"/>
    <text x="495" y="240" fill="#80DEEA" font-family="'Courier New', monospace" font-size="11">85%</text>

    <text x="280" y="271" fill="#FFD700" font-family="'Courier New', monospace" font-size="12" font-weight="900">⭐ GANAS DE APRENDER:</text>
    <rect x="425" y="261" width="65" height="10" rx="2" fill="#3e2e04"/>
    <rect x="425" y="261" width="65" height="10" rx="2" fill="url(#statGradMax)"/>
    <text x="495" y="270" fill="#FFD600" font-family="'Courier New', monospace" font-size="11" font-weight="bold">100%</text>
  </g>
</svg>
