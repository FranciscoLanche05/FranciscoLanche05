<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="260">
  <defs>
    <style>
      @keyframes tavern-light {
        0%, 100% { fill: #FFA000; filter: drop-shadow(0 0 6px #FFA000); }
        50% { fill: #FFD54F; filter: drop-shadow(0 0 16px #FFD54F); }
      }
      @keyframes mug-bubble {
        0%, 100% { transform: translateY(0); opacity: 0.8; }
        50% { transform: translateY(-3px); opacity: 1; }
      }
      .tavern-lantern { animation: tavern-light 2.5s infinite ease-in-out; }
      .bubble { animation: mug-bubble 2s infinite ease-in-out; }
    </style>
    <linearGradient id="tavernBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1423"/>
      <stop offset="50%" stop-color="#2D1E2F"/>
      <stop offset="100%" stop-color="#150E1B"/>
    </linearGradient>
    <linearGradient id="woodBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5D4037"/>
      <stop offset="50%" stop-color="#8D6E63"/>
      <stop offset="100%" stop-color="#5D4037"/>
    </linearGradient>
  </defs>

  <!-- Tavern Background Frame -->
  <rect x="5" y="5" width="840" height="250" rx="10" fill="url(#tavernBg)" stroke="#D4AF37" stroke-width="2.5"/>
  <rect x="12" y="12" width="826" height="236" rx="6" fill="none" stroke="#FFD54F" stroke-width="1" opacity="0.25"/>

  <!-- Left Hanging Tavern Sign (Solid & Permanent) -->
  <g transform="translate(45, 20)">
    <!-- Iron bracket -->
    <line x1="10" y1="10" x2="110" y2="10" stroke="#78909C" stroke-width="4"/>
    <line x1="10" y1="10" x2="30" y2="30" stroke="#78909C" stroke-width="3"/>
    <line x1="30" y1="10" x2="30" y2="25" stroke="#90A4AE" stroke-width="2"/>
    <line x1="90" y1="10" x2="90" y2="25" stroke="#90A4AE" stroke-width="2"/>
    <!-- Wooden Signboard -->
    <rect x="15" y="25" width="90" height="70" rx="6" fill="#3E2723" stroke="#D4AF37" stroke-width="2"/>
    <!-- Pixel Mug of Potion / Ale -->
    <rect x="42" y="42" width="30" height="35" rx="3" fill="#FFA000" stroke="#3E2723" stroke-width="1.5"/>
    <rect x="68" y="48" width="10" height="20" rx="2" fill="none" stroke="#FFF" stroke-width="3"/>
    <!-- Foam / Potion Head -->
    <rect class="bubble" x="38" y="36" width="38" height="10" rx="4" fill="#FFFFFF"/>
    <text x="60" y="86" fill="#FFD700" font-family="'Courier New', monospace" font-size="9.5" font-weight="bold" text-anchor="middle">TABERNA</text>
  </g>

  <!-- Central Title & Welcome Message -->
  <g transform="translate(180, 40)">
    <text x="0" y="20" fill="#FFD700" font-family="'Courier New', monospace" font-size="22" font-weight="900" letter-spacing="2">🏰 LA TABERNA DEL GREMIO · CONTACTO</text>
    <text x="0" y="46" fill="#E0E0E0" font-family="'Courier New', monospace" font-size="13">¿Tienes una propuesta de misión, proyecto o deseas charlar sobre código?</text>
    <text x="0" y="66" fill="#81C784" font-family="'Courier New', monospace" font-size="12" font-weight="bold">¡Toma asiento junto al fuego y conectemos en cualquier reino!</text>
  </g>

  <!-- Lanterns Glowing -->
  <g transform="translate(760, 45)">
    <rect x="0" y="0" width="4" height="20" fill="#78909C"/>
    <polygon class="tavern-lantern" points="-12,20 16,20 8,42 -4,42" fill="#FFA000"/>
    <circle cx="2" cy="30" r="4" fill="#FFF"/>
  </g>

  <!-- Social Link Buttons Shelf -->
  <g transform="translate(180, 130)">
    <!-- Shelf Wooden Board -->
    <rect x="-10" y="70" width="630" height="12" rx="3" fill="url(#woodBar)" stroke="#3E2723" stroke-width="1.5"/>

    <!-- Potion 1: LinkedIn (Blue) -->
    <g transform="translate(20, 0)">
      <polygon points="12,12 28,12 34,48 6,48" fill="#0077B5" stroke="#FFF" stroke-width="1.5"/>
      <rect x="15" y="4" width="10" height="8" rx="2" fill="#8D6E63"/>
      <text x="20" y="36" fill="#FFF" font-family="monospace" font-size="14" font-weight="900" text-anchor="middle">in</text>
      <text x="20" y="64" fill="#90CAF9" font-family="'Courier New', monospace" font-size="11" font-weight="bold" text-anchor="middle">LinkedIn</text>
    </g>

    <!-- Potion 2: Instagram (Pink/Purple) -->
    <g transform="translate(140, 0)">
      <polygon points="12,12 28,12 34,48 6,48" fill="#E1306C" stroke="#FFF" stroke-width="1.5"/>
      <rect x="15" y="4" width="10" height="8" rx="2" fill="#8D6E63"/>
      <text x="20" y="36" fill="#FFF" font-family="monospace" font-size="13" font-weight="900" text-anchor="middle">IG</text>
      <text x="20" y="64" fill="#F48FB1" font-family="'Courier New', monospace" font-size="11" font-weight="bold" text-anchor="middle">Instagram</text>
    </g>

    <!-- Potion 3: Discord (Blurple) -->
    <g transform="translate(260, 0)">
      <polygon points="12,12 28,12 34,48 6,48" fill="#5865F2" stroke="#FFF" stroke-width="1.5"/>
      <rect x="15" y="4" width="10" height="8" rx="2" fill="#8D6E63"/>
      <text x="20" y="36" fill="#FFF" font-family="monospace" font-size="13" font-weight="900" text-anchor="middle">DC</text>
      <text x="20" y="64" fill="#9FA8DA" font-family="'Courier New', monospace" font-size="11" font-weight="bold" text-anchor="middle">Discord</text>
    </g>

    <!-- Potion 4: Email (Red/Gold) -->
    <g transform="translate(380, 0)">
      <polygon points="12,12 28,12 34,48 6,48" fill="#D32F2F" stroke="#FFF" stroke-width="1.5"/>
      <rect x="15" y="4" width="10" height="8" rx="2" fill="#8D6E63"/>
      <text x="20" y="35" fill="#FFF" font-family="monospace" font-size="12" font-weight="900" text-anchor="middle">✉</text>
      <text x="20" y="64" fill="#EF9A9A" font-family="'Courier New', monospace" font-size="11" font-weight="bold" text-anchor="middle">Email</text>
    </g>

    <!-- Potion 5: Portfolio (Golden) -->
    <g transform="translate(500, 0)">
      <polygon points="12,12 28,12 34,48 6,48" fill="#FFB300" stroke="#FFF" stroke-width="1.5"/>
      <rect x="15" y="4" width="10" height="8" rx="2" fill="#8D6E63"/>
      <text x="20" y="36" fill="#1A1423" font-family="monospace" font-size="12" font-weight="900" text-anchor="middle">🌐</text>
      <text x="20" y="64" fill="#FFE082" font-family="'Courier New', monospace" font-size="11" font-weight="bold" text-anchor="middle">Portfolio</text>
    </g>
  </g>
</svg>
