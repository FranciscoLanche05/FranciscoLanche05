<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 40" width="100%" height="40">
  <defs>
    <style>
      @keyframes gem-pulse {
        0%, 100% { fill: #00E5FF; filter: drop-shadow(0 0 2px #00E5FF); }
        50% { fill: #E040FB; filter: drop-shadow(0 0 6px #E040FB); }
      }
      @keyframes sword-gleam {
        0%, 80%, 100% { opacity: 0.3; }
        90% { opacity: 1; }
      }
      @keyframes gold-shimmer {
        0%, 100% { stop-color: #FFD700; }
        50% { stop-color: #FFA500; }
      }
      .gem-glow { animation: gem-pulse 3s infinite ease-in-out; }
      .gleam { animation: sword-gleam 4s infinite ease-in-out; }
    </style>
    <linearGradient id="goldBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D1B00" stop-opacity="0"/>
      <stop offset="20%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#FFF2A3"/>
      <stop offset="80%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#2D1B00" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78909C"/>
      <stop offset="50%" stop-color="#ECEFF1"/>
      <stop offset="100%" stop-color="#78909C"/>
    </linearGradient>
  </defs>

  <!-- Central gold bar with pixel steps -->
  <rect x="100" y="19" width="700" height="2" fill="url(#goldBar)"/>
  <rect x="250" y="18" width="400" height="4" fill="url(#goldBar)" opacity="0.8"/>

  <!-- Left pixel ornament -->
  <rect x="230" y="16" width="8" height="8" fill="#D4AF37"/>
  <rect x="232" y="18" width="4" height="4" fill="#FFE082"/>

  <!-- Right pixel ornament -->
  <rect x="662" y="16" width="8" height="8" fill="#D4AF37"/>
  <rect x="664" y="18" width="4" height="4" fill="#FFE082"/>

  <!-- Crossed Pixel Swords (Center Emblem) -->
  <g transform="translate(450, 20)">
    <!-- Shield / Crest Background -->
    <polygon points="0,-16 14,-10 14,4 0,16 -14,4 -14,-10" fill="#1A237E" stroke="#D4AF37" stroke-width="2"/>
    <polygon points="0,-12 10,-8 10,2 0,12 -10,2 -10,-8" fill="#283593"/>
    
    <!-- Central Pixel Gem -->
    <polygon class="gem-glow" points="0,-7 6,0 0,7 -6,0" fill="#00E5FF"/>
    <circle cx="0" cy="0" r="1.5" fill="#FFFFFF"/>

    <!-- Left Wing Gold accents -->
    <rect x="-24" y="-2" width="6" height="4" fill="#D4AF37"/>
    <rect x="-32" y="-1" width="6" height="2" fill="#D4AF37"/>
    
    <!-- Right Wing Gold accents -->
    <rect x="18" y="-2" width="6" height="4" fill="#D4AF37"/>
    <rect x="26" y="-1" width="6" height="2" fill="#D4AF37"/>
  </g>
</svg>
